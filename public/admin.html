<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Quản trị Mộc Thuận</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,650;12..96,750&family=Be+Vietnam+Pro:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/admin.css">
</head>
<body>
<header class="adm-head">
  <div class="wrap adm-bar">
    <a class="logo" href="index.html" aria-label="Về trang web Mộc Thuận">
      <span class="logo-mark" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round"><path d="M3 6h14M3 10h14M3 14h9"/></svg></span>
      <span><b>Mộc Thuận</b><small>Quản lý đơn hàng &amp; sản phẩm</small></span>
    </a>
    <div class="adm-actions">
      <span class="adm-status" id="status" role="status" hidden></span>
      <a class="btn sm" id="openWeb" href="index.html" target="_blank" rel="noopener">Mở web</a>
      <span class="adm-who" id="who" hidden></span>
      <button class="btn sm ghost" id="logoutBtn" type="button" hidden>Đăng xuất</button>
    </div>
  </div>
  <nav class="wrap tabs adm-tabs" role="tablist" aria-label="Mục quản lý" hidden>
    <button role="tab" data-tab="orders">Đơn hàng<span class="pill" id="newCount" hidden></span></button>
    <button role="tab" data-tab="list">Sản phẩm</button>
    <button role="tab" data-tab="kinds">Dáng 3D có sẵn</button>
    <button role="tab" data-tab="wood">Hệ số chất liệu</button>
  </nav>
</header>

<main class="wrap adm-main"><div id="gate"></div><div id="adm" hidden></div></main>

<div id="layer"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/DRACOLoader.js"></script>
<script src="assets/js/config.js"></script>
<!-- dữ liệu dự phòng: data.js cần CATALOG khi khởi động; sản phẩm thật tải từ máy chủ sau khi đăng nhập -->
<script src="assets/js/catalog.js"></script>
<script src="assets/js/shared.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/model3d.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/admin-orders.js"></script>
<script src="assets/js/admin.js"></script>
</body>
</html>
